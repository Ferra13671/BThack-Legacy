plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id "com.github.johnrengelman.shadow" version "8.1.1"
}
/*
   A switch that can be used to enable/disable Baritone integration in the jar file.
   If:
      YES --- Baritone will be integrated into the jar file.
      NO --- Baritone will not be integrated into the jar file.
 */
project.ext.withBaritone = WithBaritone.YES
// The version of BThack to be used both in the file name and within BThack
project.ext.version = "1.5"

version = project.ext.version + (project.ext.withBaritone == WithBaritone.YES ? "" : "-NoBaritone")
group = "com.ferra13671"

void includeBaritone() {
    if (project.ext.withBaritone == WithBaritone.YES) {
        dependencies {
            modInclude "meteordevelopment:baritone:${project.baritone_version}-SNAPSHOT"
            library "dev.babbaj:nether-pathfinder:${nether_pathfinder_version}"
        }
    } else {
        dependencies {
            //It is only needed so that gradle does not generate an error
            // because of imports of non-existent classes
            modCompileOnly "meteordevelopment:baritone:${project.baritone_version}-SNAPSHOT"
        }
    }
}

enum WithBaritone {
    YES,
    NO
}

base {
    archivesName = "BThack-" + project.minecraft_version + "-fabric"
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "meteor-maven-snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
    maven {
        name = "modrinth"
        url = "https://api.modrinth.com/maven"

        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
    maven {
        url = 'https://jitpack.io'
    }

    mavenCentral()
}

configurations {
    // include mods
    modImplementation.extendsFrom(modInclude)
    include.extendsFrom(modInclude)

    // include libraries
    implementation.extendsFrom(library)
    shadow.extendsFrom(library)
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    //Remove later???
    modInclude "maven.modrinth:satin-api:${satin_version}"
    //This is to prevent warnings related to missing enum constants from appearing when launching the client in the IDE
    compileOnly "org.apiguardian:apiguardian-api:1.0.0"

    library "com.github.Ferra13671:MegaEvents:1.2"
    library "com.github.Ferra13671:SimpleLanguageSystem:1.1"
    library "com.github.Ferra13671:GLTextureUtils:1.1"
    library "com.github.Ferra13671:Java-DiscordRPC:1.0"

    includeBaritone()
}

loom {
    accessWidenerPath = file("src/main/resources/bthack.accesswidener")
}

shadowJar {
    configurations = [project.configurations.shadow]
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "bthack_version": project.ext.version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

remapJar {
    dependsOn shadowJar
    inputFile.set(shadowJar.archiveFile)
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}"}
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
